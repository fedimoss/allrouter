<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="OpenAI 接口聚合管理，支持多种渠道包括 Azure，可用于二次分发管理 key。"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <meta name="generator" content="new-api" />
    <title></title>
    <style>
      /* 首屏加载占位：JS bundle 较大，微信内置浏览器加载期间显示，避免白屏。
         React 挂载到 #root 后会自动替换掉这里的占位内容。 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #6b7280;
        background: #ffffff;
      }
      #app-loading .app-loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      #app-loading .app-loading-text {
        font-size: 14px;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var systemName = localStorage.getItem('system_name');
          if (systemName) document.title = systemName;

          var logo = localStorage.getItem('logo');
          if (!logo) return;

          var linkElement = document.querySelector("link[rel~='icon']");
          if (!linkElement) {
            linkElement = document.createElement('link');
            linkElement.rel = 'icon';
            document.head.appendChild(linkElement);
          }
          linkElement.href = logo;
        } catch (error) {
          // Keep the static fallback when localStorage is unavailable.
        }
      })();
    </script>
    <!--umami-->
    <!--Google Analytics-->
</head>

<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root">
  <div id="app-loading">
    <div class="app-loading-spinner"></div>
    <div class="app-loading-text">页面加载中，请稍候…</div>
  </div>
</div>
<script type="module" src="/src/index.jsx"></script>
</body>
</html>
